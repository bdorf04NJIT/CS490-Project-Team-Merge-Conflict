# Ruff lint and format config (S1-006).
# Run from backend/: ruff check . and ruff format .
line-length = 100
target-version = "py312"

[lint]
# E/F: pycodestyle and pyflakes errors, I: import order, B: common bugs, UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]
# Line length is handled by the formatter. Long strings it can't split are allowed.
ignore = ["E501"]
